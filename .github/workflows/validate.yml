name: Validate repository
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (rule ids, ledger schema, verifier negatives)
        run: python scripts/tests/test_offline.py
      - name: Repository validation
        run: python tools/validate_repository.py